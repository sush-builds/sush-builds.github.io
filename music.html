<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Music — Sushant</title>
<link rel="icon" type="image" href="photo.jpg">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

<style>
  :root{
    --sky-top:#bfe4fb;
    --sky-mid:#dff1fc;
    --sky-bottom:#f3f9fd;
    --glass-fill: rgba(255,255,255,0.28);
    --glass-fill-strong: rgba(255,255,255,0.45);
    --glass-border: rgba(255,255,255,0.55);
    --accent:#2e86c1;
    --accent-deep:#1b5f8c;
    --ink:#173a4d;
    --ink-soft:#3f6579;
    --shadow: 0 8px 32px rgba(31,84,120,0.18);
    --radius-lg: 28px;
    --radius-md: 20px;
    --spotify-green:#1DB954;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html{scroll-behavior:smooth;}
  body{
    font-family:'Inter', sans-serif;
    color:var(--ink);
    min-height:100vh;
    background:
      radial-gradient(circle at 15% 20%, rgba(255,255,255,0.6), transparent 40%),
      radial-gradient(circle at 85% 10%, rgba(255,255,255,0.5), transparent 45%),
      linear-gradient(160deg, var(--sky-top) 0%, var(--sky-mid) 55%, var(--sky-bottom) 100%);
    overflow-x:hidden;
    position:relative;
  }

  /* ---------- Header (matches portfolio) ---------- */
  header{
    position: fixed;
    top: 16px;
    left: 50%;
    transform: translateX(-50%);
    width: calc(100% - 10vw);
    max-width: 1000px;
    height: 60px;
    z-index: 1000;
    background: rgba(255, 255, 255, 0.45);
    border: 1px solid rgba(255, 255, 255, 0.65);
    border-radius: 999px;
    backdrop-filter: blur(20px) saturate(160%);
    -webkit-backdrop-filter: blur(20px) saturate(160%);
    box-shadow: 0 8px 32px rgba(31, 84, 120, 0.15), inset 0 1px 0 rgba(255, 255, 255, 0.8);
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 12px 0 28px;
    gap: 12px;
  }
  header .brand{
    font-family: 'Outfit', sans-serif;
    font-weight: 800;
    font-size: 1.35rem;
    letter-spacing: 0.05em;
    color: var(--accent-deep);
    text-decoration:none;
    flex-shrink: 0;
  }
  nav{ display:flex; align-items:center; gap:4px; font-family:'Outfit', sans-serif; }
  .nav-link{
    text-decoration:none; color:var(--ink); font-weight:600; font-size:0.9rem;
    padding:8px 14px; border-radius:999px;
    transition: background 0.2s ease, color 0.2s ease, transform 0.2s ease;
    white-space:nowrap;
  }
  .nav-link:hover, .nav-link:focus-visible{
    background: rgba(255,255,255,0.55); color: var(--accent-deep); transform: translateY(-1px);
  }
  .nav-link.active{ background: var(--glass-fill-strong); color: var(--accent-deep); }
  @media (max-width:640px){
    header{ padding-right:10px !important; }
    .nav-link{ padding:8px 9px; font-size:0.82rem; }
  }
  @media (max-width:420px){
    header{ padding-left:18px !important; }
    nav{ gap:0; }
    .nav-link{ padding:8px 7px; font-size:0.76rem; }
  }

  main{
    position:relative; z-index:1; max-width:800px; margin:0 auto;
    padding:12vh 5vw 10vh; display:flex; flex-direction:column; gap:24px;
  }

  .page-intro{ text-align:center; padding:2vh 6vw 0; }
  .page-intro h1{
    font-family:'Outfit', sans-serif; font-weight:800;
    font-size:clamp(2rem, 5vw, 3rem); letter-spacing:-0.02em; color:var(--ink);
  }
  .page-intro p{ color:var(--ink-soft); margin-top:8px; font-size:1rem; }

  .glass{
    background:var(--glass-fill);
    border:1px solid var(--glass-border);
    border-radius:var(--radius-lg);
    backdrop-filter:blur(18px) saturate(140%);
    -webkit-backdrop-filter:blur(18px) saturate(140%);
    box-shadow:var(--shadow);
  }

  /* ---------- Spotify embed slot ---------- */
  .embed-slot{
    padding:20px;
    display:flex;
    flex-direction:column;
    gap:10px;
  }
  .embed-slot .slot-label{
    font-family:'Outfit', sans-serif; font-weight:700; font-size:0.9rem;
    color:var(--accent-deep);
    display:flex; align-items:center; gap:8px;
  }
  .embed-slot .slot-label svg{ width:18px; height:18px; fill:var(--spotify-green); }

  /*
    ============================================================
    HOW TO ADD YOUR SPOTIFY EMBEDS
    ------------------------------------------------------------
    1. Open the playlist/album/track in Spotify (desktop or web).
    2. Click the "···" (more) menu → Share → Embed playlist.
    3. Spotify gives you an <iframe> snippet. Copy just the
       <iframe ...>...</iframe> part.
    4. Paste it inside the matching .embed-frame div below,
       replacing the placeholder comment.

    Recommended iframe attributes to keep (Spotify includes
    these by default):
      style="border-radius:12px"
      width="100%"
      height="352"   (or 152 for compact track view)
      frameBorder="0"
      allowfullscreen=""
      allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture"
      loading="lazy"

    You can duplicate the whole .embed-slot block below for as
    many playlists/albums/tracks as you want.
    ============================================================
  */

  .embed-frame{
    width:100%;
    min-height:80px;
    border-radius:12px;
    background:rgba(255,255,255,0.4);
    border:1px dashed var(--glass-border);
    display:flex;
    align-items:center;
    justify-content:center;
    color:var(--ink-soft);
    font-size:0.85rem;
    padding:20px;
    text-align:center;
  }
  .embed-frame iframe{
    width:100%;
    border-radius:12px;
    border:none;
    display:block;
  }

  footer{
    text-align:center; color:var(--ink-soft); font-size:0.85rem; padding-top:10px;
  }
  footer a{ color:var(--accent-deep); }
</style>
</head>
<body>

  <nav>

    <a class="nav-link" href="game.html">Games</a>
    <a class="nav-link active" href="music.html">Music</a>
  </nav>
</header>
