<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pure HTML/CSS Interactive Portfolio Pet</title>
  <style>
    /* Widget Base Styling */
    .pet-container {
      width: 320px;
      margin: 40px auto;
      padding: 24px;
      background: #1e293b;
      border-radius: 16px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
      text-align: center;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: #f8fafc;
    }

    .pet-container h3 {
      margin: 0 0 16px 0;
      color: #38bdf8;
      font-size: 1.2rem;
    }

    /* Hide the logic checkboxes */
    .pet-toggle {
      display: none;
    }

    /* The Pet Display Area */
    .pet-stage {
      position: relative;
      width: 160px;
      height: 160px;
      margin: 0 auto 20px;
      background: #0f172a;
      border-radius: 50%;
      display: flex;
      justify-content: center;
      align-items: center;
      border: 3px solid #334155;
    }

    /* Speech Bubble */
    .speech-bubble {
      position: absolute;
      top: -15px;
      background: #38bdf8;
      color: #0f172a;
      padding: 6px 12px;
      border-radius: 12px;
      font-weight: bold;
      font-size: 0.85rem;
      opacity: 0;
      transform: translateY(10px);
      transition: all 0.3s ease;
      pointer-events: none;
    }

    .speech-bubble::after {
      content: '';
      position: absolute;
      bottom: -6px;
      left: 50%;
      transform: translateX(-50%);
      border-width: 6px 6px 0;
      border-style: solid;
      border-color: #38bdf8 transparent;
    }

    /* CSS Pure-Code Cat Character */
    .cat {
      position: relative;
      width: 80px;
      height: 70px;
      background: #f97316; /* Orange Cat */
      border-radius: 40px 40px 30px 30px;
      transition: transform 0.3s ease;
      animation: idleBob 3s infinite ease-in-out;
    }

    /* Ears */
    .cat::before, .cat::after {
      content: '';
      position: absolute;
      top: -12px;
      width: 0;
      height: 0;
      border-left: 12px solid transparent;
      border-right: 12px solid transparent;
      border-bottom: 20px solid #f97316;
    }
    .cat::before { left: 4px; transform: rotate(-15deg); }
    .cat::after { right: 4px; transform: rotate(15deg); }

    /* Eyes */
    .eyes {
      position: absolute;
      top: 24px;
      width: 100%;
      display: flex;
      justify-content: space-around;
      padding: 0 16px;
      box-sizing: border-box;
    }
    .eye {
      width: 12px;
      height: 12px;
      background: #0f172a;
      border-radius: 50%;
      transition: all 0.2s ease;
    }

    /* Mouth */
    .mouth {
      position: absolute;
      bottom: 16px;
      left: 50%;
      transform: translateX(-50%);
      width: 10px;
      height: 6px;
      border-bottom: 3px solid #0f172a;
      border-radius: 0 0 10px 10px;
      transition: all 0.2s ease;
    }

    /* Food Bowl (Hidden by default) */
    .food-bowl {
      position: absolute;
      bottom: 15px;
      right: 20px;
      font-size: 1.5rem;
      opacity: 0;
      transform: scale(0);
      transition: all 0.3s ease;
    }

    /* Interactive Buttons */
    .controls {
      display: flex;
      justify-content: center;
      gap: 10px;
    }

    .btn {
      display: inline-block;
      padding: 8px 16px;
      background: #334155;
      color: #f8fafc;
      border-radius: 8px;
      font-size: 0.85rem;
      font-weight: bold;
      cursor: pointer;
      user-select: none;
      transition: background 0.2s, transform 0.1s;
    }

    .btn:hover {
      background: #475569;
    }

    .btn:active {
      transform: scale(0.95);
    }

    /* --- HTML/CSS INTERACTIVE STATE LOGIC --- */

    /* 1. Action: Pet Cat */
    #toggle-pet:checked ~ .pet-stage .cat {
      animation: purr 0.4s infinite alternate;
    }
    #toggle-pet:checked ~ .pet-stage .speech-bubble-pet {
      opacity: 1;
      transform: translateY(0);
    }
    #toggle-pet:checked ~ .controls .btn-pet {
      background: #e11d48;
    }

    /* 2. Action: Feed Cat */
    #toggle-feed:checked ~ .pet-stage .food-bowl {
      opacity: 1;
      transform: scale(1);
    }
    #toggle-feed:checked ~ .pet-stage .speech-bubble-feed {
      opacity: 1;
      transform: translateY(0);
    }
    #toggle-feed:checked ~ .controls .btn-feed {
      background: #16a34a;
    }

    /* 3. Action: Sleep Mode */
    #toggle-sleep:checked ~ .pet-stage .eye {
      height: 2px;
      margin-top: 5px;
    }
    #toggle-sleep:checked ~ .pet-stage .cat {
      animation: none;
      transform: translateY(8px);
    }
    #toggle-sleep:checked ~ .pet-stage .speech-bubble-sleep {
      opacity: 1;
      transform: translateY(0);
    }
    #toggle-sleep:checked ~ .controls .btn-sleep {
      background: #9333ea;
    }

    /* Keyframe Animations */
    @keyframes idleBob {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-6px); }
    }

    @keyframes purr {
      0% { transform: scale(1) translateY(0); }
      100% { transform: scale(1.05) translateY(-4px); }
    }
  </style>
</head>
<body>

  <div class="pet-container">
    <h3>Portfolio Companion</h3>

    <input type="checkbox" id="toggle-pet" class="pet-toggle">
    <input type="checkbox" id="toggle-feed" class="pet-toggle">
    <input type="checkbox" id="toggle-sleep" class="pet-toggle">

    <div class="pet-stage">
      <div class="speech-bubble speech-bubble-pet">Purrr! ❤️</div>
      <div class="speech-bubble speech-bubble-feed">Nom nom! 🐟</div>
      <div class="speech-bubble speech-bubble-sleep">Zzz... 🌙</div>

      <div class="cat">
        <div class="eyes">
          <div class="eye"></div>
          <div class="eye"></div>
        </div>
        <div class="mouth"></div>
      </div>

      <div class="food-bowl">🐟</div>
    </div>

    <div class="controls">
      <label for="toggle-pet" class="btn btn-pet">Pet</label>
      <label for="toggle-feed" class="btn btn-feed">Feed</label>
      <label for="toggle-sleep" class="btn btn-sleep">Sleep</label>
    </div>
  </div>

</body>
</html>
